<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | یدک‌یار</title>
<meta name="description" content="پنل مدیریت یدک‌یار: محصولات، قیمت‌ها، تصاویر، سفارش‌ها و تنظیمات.">
<meta name="theme-color" content="#2563eb">
<meta property="og:type" content="website">
<meta property="og:site_name" content="یدک‌یار">
<meta property="og:title" content="پنل مدیریت | یدک‌یار">
<meta property="og:description" content="پنل مدیریت یدک‌یار: محصولات، قیمت‌ها، تصاویر، سفارش‌ها و تنظیمات.">
<meta property="og:locale" content="fa_IR">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232563eb%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2719%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27%3E%D9%8A%3C/text%3E%3C/svg%3E">

<link rel="stylesheet" href="assets/css/app.css?v=13">
<style>
body{display:grid;grid-template-columns:262px 1fr;min-height:100vh;background:var(--bg)}
@media(max-width:920px){body{grid-template-columns:1fr}.sb{position:static!important;height:auto!important}}
.sb{background:var(--nav);border-left:1px solid #16345f;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.sb .lg{display:flex;align-items:center;gap:9px;margin-bottom:18px}
.sb .lg b{font-size:16px;color:#fff;font-weight:700}
.sb .lg .mini{color:#8fb0da}
.sb a{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:12px;font-size:13.5px;color:var(--mut);cursor:pointer;margin-bottom:3px}
.sb a:hover{background:var(--acc-s);color:var(--tx)}
.sb a.on{background:linear-gradient(135deg,var(--acc-s),rgba(99,102,241,.2));color:#fff}
.main{padding:26px 24px;overflow:auto}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.imgbox{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.imgbox .it{position:relative;width:92px}
.imgbox img{width:92px;height:70px;object-fit:cover;border-radius:11px;border:2px solid var(--bd)}
.imgbox .it.main img{border-color:var(--ok)}
.imgbox .it b{position:absolute;top:3px;right:3px;background:var(--ok);color:#04231a;font-size:9.5px;padding:1px 6px;border-radius:6px}
.imgbox .it .rm{position:absolute;bottom:3px;left:3px;background:rgba(190,30,30,.9);border:0;color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:11px}
.drop{border:2px dashed var(--bd2);border-radius:var(--r);padding:22px;text-align:center;color:var(--mut);font-size:14px;cursor:pointer;transition:.2s;background:var(--soft)}
.drop:hover{border-color:var(--acc);background:var(--acc-s);color:var(--acc)}
.bar{height:9px;background:var(--soft);border-radius:6px;overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px}
.mini{font-size:12.5px;color:var(--mut)}
.inl{background:var(--ok-s);border:1px dashed transparent;padding:4px 10px;border-radius:8px;cursor:pointer;color:var(--ok);font-weight:700;direction:ltr;display:inline-block}
.inl:hover{border-color:var(--ok);background:#d6f0e6}
.hsedit{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--bd)}
.hsedit img{width:100%;display:block}
.hsedit .pt{position:absolute;width:24px;height:24px;margin:-12px;border-radius:50%;background:var(--acc);border:2px solid #fff;color:#fff;display:grid;place-items:center;font-size:11px;cursor:move}
</style></head><body>
<aside class="sb">
 <div class="lg"><span style="font-size:20px">⚙️</span><span><b>یدک‌یار</b><div class="mini">پنل مدیریت</div></span></div>
 <nav id="nav"></nav>
 <a href="home.html" style="margin-top:16px;border:1px solid rgba(255,255,255,.18)">🌐 مشاهدهٔ سایت</a>
 <a id="out" style="color:var(--bad)">🚪 خروج</a>
</aside>
<main class="main" id="main"></main>
<div class="toast" id="toast"></div>
<script src="assets/js/seed.js?v=13"></script><script src="assets/js/db.js?v=13"></script><script src="assets/js/ui.js?v=13"></script>
<script>
if(!DB.isAdmin())location.href='admin-login.html';
const PAGES=[['dash','📊 داشبورد'],['products','📦 مدیریت محصولات'],['images','🖼️ مدیریت تصاویر'],
 ['prices','💰 مدیریت قیمت‌ها'],['orders','🧾 سفارش‌ها'],['customers','👥 مشتریان'],
 ['vehicles','🚗 خودروهای سه‌بعدی'],['cats','🗂️ دسته‌بندی‌ها'],['settings','⚙️ تنظیمات']];
let page=location.hash.replace('#','')||'dash';
$('#nav').innerHTML=PAGES.map(p=>`<a data-p="${p[0]}" class="${page===p[0]?'on':''}">${p[1]}</a>`).join('');
$('#nav').onclick=e=>{const a=e.target.closest('[data-p]');if(!a)return;page=a.dataset.p;location.hash=page;
 $$('#nav a').forEach(x=>x.classList.toggle('on',x.dataset.p===page));render()};
$('#out').onclick=()=>{DB.adminLogout();location.href='admin-login.html'};
const M=$('#main');
const img2b64=(f)=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
function imgsOf(p){return p.images&&p.images.length?p.images:[p.img]}

/* ---------- DASHBOARD ---------- */
function dash(){
 const s=DB.stats(),orders=DB.orders().slice(0,8);
 const byCat={};DB.allProducts().forEach(p=>{const c=DB.category(p.categoryId);if(c)byCat[c.name]=(byCat[c.name]||0)+1});
 const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,7),mx=Math.max(...top.map(t=>t[1]),1);
 M.innerHTML=`<div class="hdr"><div><h2 class="h2">داشبورد مدیر</h2><div class="sub">نمای کلی فروشگاه — ${new Date().toLocaleDateString('fa-IR')}</div></div></div>
 <div class="stats">
  <div class="stat"><div class="l">کل محصولات</div><div class="v">${fa(s.products)}</div><div class="mini">${fa(s.active)} فعال</div></div>
  <div class="stat"><div class="l">سفارش‌ها</div><div class="v" style="color:var(--acc2)">${fa(s.orders)}</div><div class="mini">${fa(s.newOrders)} سفارش جدید</div></div>
  <div class="stat"><div class="l">مشتریان</div><div class="v" style="color:var(--pur)">${fa(s.customers)}</div></div>
  <div class="stat"><div class="l">فروش کل</div><div class="v" style="color:var(--ok)">${fa(s.revenue)}</div><div class="mini">تومان</div></div>
  <div class="stat"><div class="l">ارزش موجودی انبار</div><div class="v" style="color:var(--ok)">${fa(s.stockValue)}</div><div class="mini">تومان</div></div>
  <div class="stat"><div class="l">کم‌موجود / ناموجود</div><div class="v" style="color:var(--warn)">${fa(s.low.length)} / ${fa(s.out.length)}</div></div>
 </div>
 <div style="display:grid;grid-template-columns:1.3fr .8fr;gap:16px;margin-top:18px" class="dashgrid">
  <div class="card pad"><div class="tt"><h3>آخرین سفارش‌ها</h3><a onclick="location.hash='orders';location.reload()" class="mini" style="cursor:pointer">همه ←</a></div>
   ${orders.length?`<div class="scroll"><table class="tbl"><thead><tr><th>شماره</th><th>مشتری</th><th>مبلغ</th><th>وضعیت</th><th>تاریخ</th></tr></thead><tbody>
   ${orders.map(o=>{const st=DB.STATUSES.find(x=>x.id===o.status);
    return `<tr><td style="direction:ltr">${o.number}</td><td>${o.customer.name}</td><td class="price">${fa(o.total)}</td>
    <td><span class="tag ${st.color}">${st.name}</span></td><td class="mini">${new Date(o.createdAt).toLocaleDateString('fa-IR')}</td></tr>`}).join('')}
   </tbody></table></div>`:'<div class="empty">هنوز سفارشی ثبت نشده. از سمت سایت یک خرید آزمایشی انجام دهید.</div>'}</div>
  <div class="card pad"><div class="tt"><h3>محصولات بر اساس دسته</h3></div>
   ${top.map(t=>`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${t[0]}</span><span>${fa(t[1])}</span></div>
    <div class="bar"><i style="width:${t[1]/mx*100}%"></i></div></div>`).join('')}</div>
 </div>
 ${s.low.length||s.out.length?`<div class="card pad" style="margin-top:16px"><div class="tt"><h3>⚠️ نیازمند توجه</h3></div>
  <div class="scroll" style="max-height:260px"><table class="tbl"><thead><tr><th>محصول</th><th>موجودی</th><th></th></tr></thead><tbody>
  ${[...s.out,...s.low].slice(0,12).map(p=>`<tr><td>${p.name}</td>
   <td>${p.stock===0?'<span class="tag t-bad">ناموجود</span>':'<span class="tag t-warn">'+fa(p.stock)+' عدد</span>'}</td>
   <td><button class="btn g sm" onclick="editProduct('${p.id}')">ویرایش</button></td></tr>`).join('')}</tbody></table></div></div>`:''}`;
}
/* ---------- PRODUCTS ---------- */
let pq='',pfv='',pfc='';
function products(){
 let list=DB.allProducts();
 if(pfv)list=list.filter(p=>p.vehicleId===pfv);
 if(pfc)list=list.filter(p=>p.categoryId===pfc);
 if(pq)list=list.filter(p=>(p.name+p.sku+p.brand+(p.oem||[]).join('')).toLowerCase().includes(pq.toLowerCase()));
 M.innerHTML=`<div class="hdr"><div><h2 class="h2">مدیریت محصولات</h2><div class="sub">${fa(list.length)} محصول</div></div>
  <button class="btn" onclick="editProduct()">➕ افزودن محصول</button></div>
 <div class="card pad" style="margin-bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px">
  <div><label>جستجو</label><input id="q" value="${pq}" placeholder="نام، SKU یا OEM"></div>
  <div><label>خودرو</label><select id="fv"><option value="">همه</option>${DB.vehicles().map(v=>`<option value="${v.id}" ${pfv===v.id?'selected':''}>${v.brandFa} ${v.modelFa}</option>`).join('')}</select></div>
  <div><label>دسته</label><select id="fc"><option value="">همه</option>${DB.categories().map(c=>`<option value="${c.id}" ${pfc===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div>
 </div>
 <div class="card"><div class="scroll"><table class="tbl"><thead><tr><th>تصویر</th><th>نام محصول</th><th>SKU</th><th>برند</th><th>دسته</th><th>قیمت</th><th>موجودی</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>
 ${list.slice(0,200).map(p=>`<tr><td><img alt="تصویر محصول یدک‌یار" src="${imgsOf(p)[0]}"></td>
  <td style="max-width:260px">${p.name}<div class="mini">${(p.oem||[]).join(' · ')||'بدون OEM'}</div></td>
  <td style="direction:ltr">${p.sku}</td><td>${p.brand}</td><td class="mini">${(DB.category(p.categoryId)||{}).name||'-'}</td>
  <td><span class="inl" onclick="quickPrice('${p.id}')">${fa(p.price)}</span></td>
  <td><span class="inl" style="color:var(--warn)" onclick="quickStock('${p.id}')">${fa(p.stock)}</span></td>
  <td>${p.active===false?'<span class="tag t-bad">غیرفعال</span>':'<span class="tag t-ok">فعال</span>'}</td>
  <td style="white-space:nowrap"><button class="btn g sm" onclick="editProduct('${p.id}')">✏️</button>
   <button class="btn g sm" onclick="toggleActive('${p.id}')">${p.active===false?'✅':'⏸'}</button>
   <button class="btn g sm" onclick="delProduct('${p.id}')">🗑</button></td></tr>`).join('')}
 </tbody></table></div></div>
 ${list.length>200?'<div class="mini" style="margin-top:8px">۲۰۰ مورد اول نمایش داده شد — از فیلترها استفاده کنید.</div>':''}`;
 $('#q').oninput=e=>{pq=e.target.value;products()};
 $('#fv').onchange=e=>{pfv=e.target.value;products()};
 $('#fc').onchange=e=>{pfc=e.target.value;products()};
}
function quickPrice(id){const p=DB.product(id);const v=prompt('قیمت جدید (تومان) برای:\n'+p.name,p.price);
 if(v===null)return;DB.upsert('products',{id,price:+en(v)||0});toast('قیمت به‌روز شد ✓');render()}
function quickStock(id){const p=DB.product(id);const v=prompt('موجودی جدید:',p.stock);
 if(v===null)return;DB.upsert('products',{id,stock:+en(v)||0});toast('موجودی به‌روز شد ✓');render()}
function toggleActive(id){const p=DB.product(id)||DB.get('products',id);
 DB.upsert('products',{id,active:p.active===false});render()}
function delProduct(id){if(confirm('این محصول حذف شود؟')){DB.remove('products',id);toast('حذف شد');render()}}
function editProduct(id){
 const p=id?DB.get('products',id):{id:DB.nextProductId(),name:'',nameEn:'',sku:'',brand:'',manufacturer:'',
  partId:DB.parts()[0].id,vehicleId:DB.vehicles()[0].id,categoryId:DB.categories()[0].id,
  price:0,oldPrice:0,stock:0,oem:[],images:[],img:'assets/img/part-filter.jpg',grade:'شرکتی',gradeCode:'aftermarket',
  years:[2015,2020],engines:[],warranty:'۶ ماه',desc:'',specs:{},sold:0,active:true,oemVerified:false,source:''};
 modal(id?'ویرایش محصول':'افزودن محصول',`
  <div class="row2"><div><label>نام محصول (فارسی) *</label><input id="e-name" value="${p.name}"></div>
   <div><label>نام انگلیسی</label><input id="e-nameEn" value="${p.nameEn}" dir="ltr"></div></div>
  <div class="row2"><div><label>کد کالا (SKU)</label><input id="e-sku" value="${p.sku}" dir="ltr"></div>
   <div><label>شماره‌های OEM (با کاما جدا کنید)</label><input id="e-oem" value="${(p.oem||[]).join(', ')}" dir="ltr"></div></div>
  <div class="row2"><div><label>برند / تولیدکننده</label><input id="e-brand" value="${p.brand}"></div>
   <div><label>گرید</label><select id="e-grade">
    <option value="original" ${p.gradeCode==='original'?'selected':''}>اصلی OEM</option>
    <option value="aftermarket" ${p.gradeCode==='aftermarket'?'selected':''}>شرکتی</option>
    <option value="economy" ${p.gradeCode==='economy'?'selected':''}>اقتصادی</option></select></div></div>
  <div class="row2"><div><label>خودروی سازگار</label><select id="e-veh">${DB.vehicles().map(v=>`<option value="${v.id}" ${p.vehicleId===v.id?'selected':''}>${v.brandFa} ${v.modelFa}</option>`).join('')}</select></div>
   <div><label>قطعه (اتصال به مدل سه‌بعدی)</label><select id="e-part">${DB.parts().map(x=>`<option value="${x.id}" ${p.partId===x.id?'selected':''}>${x.name}</option>`).join('')}</select></div></div>
  <div class="row2"><div><label>دسته‌بندی</label><select id="e-cat">${DB.categories().map(c=>`<option value="${c.id}" ${p.categoryId===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div>
   <div><label>سال‌های سازگار (از - تا)</label><div style="display:flex;gap:6px">
    <input id="e-y1" value="${p.years[0]}" dir="ltr"><input id="e-y2" value="${p.years[1]}" dir="ltr"></div></div></div>
  <div class="row2"><div><label>قیمت (تومان) *</label><input id="e-price" value="${p.price}" dir="ltr"></div>
   <div><label>قیمت قبل از تخفیف (۰ = بدون تخفیف)</label><input id="e-old" value="${p.oldPrice||0}" dir="ltr"></div></div>
  <div class="row2"><div><label>موجودی انبار</label><input id="e-stock" value="${p.stock}" dir="ltr"></div>
   <div><label>گارانتی</label><input id="e-war" value="${p.warranty||''}"></div></div>
  <label>توضیحات</label><textarea id="e-desc">${p.desc||''}</textarea>
  <label>منبع اطلاعات / شماره فنی</label><input id="e-src" value="${p.source||''}">
  <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="e-ver" style="width:auto" ${p.oemVerified?'checked':''}> شمارهٔ OEM تأیید شده است</label>
  <label>تصاویر محصول</label>
  <div class="imgbox" id="e-imgs"></div>
  <div class="drop" id="e-drop">🖼️ برای آپلود تصویر کلیک کنید یا فایل را اینجا رها کنید (چند فایل مجاز است)</div>
  <input type="file" id="e-file" accept="image/*" multiple hidden>
  <button class="btn wide" style="margin-top:16px" id="e-save">${id?'ذخیرهٔ تغییرات':'افزودن محصول'}</button>`,820);
 let imgs=[...imgsOf(p)];
 const drawImgs=()=>{$('#e-imgs').innerHTML=imgs.map((s,i)=>`<div class="it ${i===0?'main':''}">
   <img alt="تصویر محصول یدک‌یار" src="${s}" onclick="window._setMain(${i})" title="کلیک = تصویر اصلی">${i===0?'<b>اصلی</b>':''}
   <button class="rm" onclick="window._rmImg(${i})">✕</button></div>`).join('')||'<span class="mini">تصویری ندارد</span>'};
 window._setMain=i=>{const [x]=imgs.splice(i,1);imgs.unshift(x);drawImgs();toast('تصویر اصلی تغییر کرد')};
 window._rmImg=i=>{imgs.splice(i,1);drawImgs()};
 drawImgs();
 $('#e-drop').onclick=()=>$('#e-file').click();
 $('#e-drop').ondragover=e=>{e.preventDefault();$('#e-drop').style.borderColor='var(--acc)'};
 $('#e-drop').ondrop=async e=>{e.preventDefault();for(const f of e.dataTransfer.files)if(f.type.startsWith('image/'))imgs.push(await img2b64(f));drawImgs()};
 $('#e-file').onchange=async e=>{for(const f of e.target.files)imgs.push(await img2b64(f));drawImgs();toast('تصویر افزوده شد ✓')};
 $('#e-save').onclick=()=>{
  const name=$('#e-name').value.trim();if(!name){toast('نام محصول الزامی است',1);return}
  const gc=$('#e-grade').value,v=DB.vehicle($('#e-veh').value),pt=DB.part($('#e-part').value);
  const o={...p,name,nameEn:$('#e-nameEn').value.trim(),
   sku:$('#e-sku').value.trim()||('AP-'+p.id),brand:$('#e-brand').value.trim()||'نامشخص',
   manufacturer:$('#e-brand').value.trim(),gradeCode:gc,
   grade:{original:'اصلی (OEM)',aftermarket:'شرکتی / برند معتبر',economy:'اقتصادی'}[gc],
   vehicleId:v.id,partId:pt.id,categoryId:$('#e-cat').value,
   years:[+en($('#e-y1').value)||2015,+en($('#e-y2').value)||2020],
   price:+en($('#e-price').value)||0,oldPrice:+en($('#e-old').value)||0,
   stock:+en($('#e-stock').value)||0,warranty:$('#e-war').value.trim(),
   desc:$('#e-desc').value.trim(),source:$('#e-src').value.trim(),
   oemVerified:$('#e-ver').checked,
   oem:$('#e-oem').value.split(',').map(s=>s.trim()).filter(Boolean),
   images:imgs,img:imgs[0]||'assets/img/part-filter.jpg',engines:v.engines,
   specs:{...p.specs,'سازنده':$('#e-brand').value.trim(),'خودروی سازگار':v.brandFa+' '+v.modelFa,
    'سال‌های سازگار':`${$('#e-y1').value} تا ${$('#e-y2').value}`,'موتور':v.engines.join('، ')},
   active:p.active!==false};
  DB.upsert('products',o);$('#ov').classList.remove('on');toast('ذخیره شد ✓');render()};
}
/* ---------- IMAGES ---------- */
let iq='';
function images(){
 let list=DB.allProducts();if(iq)list=list.filter(p=>p.name.includes(iq)||p.sku.toLowerCase().includes(iq.toLowerCase()));
 M.innerHTML=`<div class="hdr"><div><h2 class="h2">مدیریت تصاویر</h2>
  <div class="sub">آپلود، حذف، تغییر تصویر اصلی و مرتب‌سازی تصاویر محصولات</div></div>
  <input id="iq" value="${iq}" placeholder="جستجوی محصول…" style="max-width:280px"></div>
 <div class="card"><div class="scroll"><table class="tbl"><thead><tr><th>محصول</th><th>تصاویر</th><th>عملیات</th></tr></thead><tbody>
 ${list.slice(0,60).map(p=>`<tr><td style="max-width:230px">${p.name}<div class="mini">${p.sku}</div></td>
  <td><div class="imgbox">${imgsOf(p).map((s,i)=>`<div class="it ${i===0?'main':''}">
    <img alt="تصویر محصول یدک‌یار" src="${s}" onclick="setMainImg('${p.id}',${i})" title="کلیک = تصویر اصلی">${i===0?'<b>اصلی</b>':''}
    <button class="rm" onclick="rmProdImg('${p.id}',${i})">✕</button></div>`).join('')}</div></td>
  <td><button class="btn g sm" onclick="uploadFor('${p.id}')">⬆️ آپلود تصویر</button></td></tr>`).join('')}

function editHotspots(id){

 modal('نقاط قطعات روی موتورخانهٔ '+v.modelFa,`
  <div class="mini" style="margin-bottom:8px">روی تصویر کلیک کنید تا نقطهٔ جدید اضافه شود؛ نقاط را بکشید تا جابه‌جا شوند.</div>
  <label>قطعه برای نقطهٔ جدید</label><select id="h-part">${DB.parts().map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
  <div class="hsedit" id="hsw" style="margin-top:10px"><img alt="تصویر محصول یدک‌یار" src="${v.bay}"></div>
  <div id="hlist" style="margin-top:10px"></div>
  <button class="btn wide" style="margin-top:12px" id="h-save">ذخیرهٔ نقاط</button>`,760);
 const w=$('#hsw');
 const draw=()=>{$$('.pt',w).forEach(x=>x.remove());
  hs.forEach((h,i)=>{const d=document.createElement('div');d.className='pt';d.style.right=h.x+'%';d.style.top=h.y+'%';
   d.textContent=i+1;d.title=(DB.part(h.partId)||{}).name||'';w.appendChild(d);
   d.onpointerdown=e=>{e.stopPropagation();d.setPointerCapture(e.pointerId);
    const mv=ev=>{const r=w.getBoundingClientRect();
     h.x=Math.max(1,Math.min(99,(r.right-ev.clientX)/r.width*100));
     h.y=Math.max(1,Math.min(99,(ev.clientY-r.top)/r.height*100));
     d.style.right=h.x+'%';d.style.top=h.y+'%'};
    const up=()=>{w.removeEventListener('pointermove',mv);w.removeEventListener('pointerup',up);list()};
    w.addEventListener('pointermove',mv);w.addEventListener('pointerup',up)}});
  list()};
 const list=()=>{$('#hlist').innerHTML=hs.map((h,i)=>`<div style="display:flex;gap:8px;align-items:center;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--bd)">
   <b>${i+1}</b><span>${(DB.part(h.partId)||{}).name||'؟'}</span>
   <span class="mini" style="margin-right:auto">x:${Math.round(h.x)}% y:${Math.round(h.y)}%</span>
   <button class="btn g sm" onclick="window._rmHs(${i})">حذف</button></div>`).join('')||'<div class="mini">نقطه‌ای ثبت نشده</div>'};
 window._rmHs=i=>{hs.splice(i,1);draw()};
 w.onclick=e=>{if(e.target.classList.contains('pt'))return;const r=w.getBoundingClientRect();
  hs.push({partId:$('#h-part').value,x:(r.right-e.clientX)/r.width*100,y:(e.clientY-r.top)/r.height*100});draw()};
 draw();
 $('#h-save').onclick=()=>{DB.upsert('vehicles',{id:v.id,hotspots:hs});$('#ov').classList.remove('on');toast('نقاط ذخیره شد ✓');render()};
}

  <div class="mini" style="margin-top:10px;padding:10px;border-radius:10px;background:var(--acc-s);line-height:2">
   ⚠️ اسکرپ قیمت از یک سایت دیگر <b>نیازمند سرویس سمت سرور</b> است (مرورگر به‌خاطر CORS اجازه ندارد).
   اسکریپت <code>price_worker.py</code> در ریشهٔ پروژه همین کار را می‌کند؛ با دستور
   <code dir="ltr">python3 price_worker.py</code> اجرا شود تا هر ساعت <code>assets/data/prices.json</code> را بسازد.
   رعایت قوانین <code>robots.txt</code> و شرایط استفادهٔ سایت مرجع بر عهدهٔ شماست.
  </div></div>`;
 $('#s-save').onclick=()=>{DB.saveSettings({adminUser:$('#s-u').value.trim(),adminPass:$('#s-p').value,
  shopName:$('#s-n').value.trim(),freeShipOver:+en($('#s-f').value)||0});toast('ذخیره شد ✓')};
 $('#sh-save').onclick=()=>{const ns=$$('.sn').map((x,i)=>({...s.shipping[i],name:x.value,price:+en($$('.sp')[i].value)||0}));
  DB.saveSettings({shipping:ns});toast('ذخیره شد ✓')};
 $('#exp').onclick=()=>{const d={products:DB.allProducts(),vehicles:DB.vehicles(),parts:DB.parts(),
   categories:DB.categories(),orders:DB.orders(),customers:DB.all('customers')};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:'application/json'}));
  a.download='yadakyar-data.json';a.click();toast('خروجی گرفته شد ✓')};
 $('#rst').onclick=()=>{if(confirm('همهٔ تغییرات پاک و داده‌ها به حالت اولیه برگردد؟')){DB.reset();toast('بازنشانی شد');render()}};

 // ---- به‌روزرسانی خودکار قیمت ----
 $('#pu-match').value = s.priceMatch||'name';
 const puLog=$('#pu-log');
 fetch('assets/data/prices.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{
   $('#pu-state').textContent = d.status==='ok' ? `آخرین اجرا: ${d.updatedAt} — ${d.count} قیمت` :
     d.status==='disabled' ? 'غیرفعال' : 'خطا: '+(d.message||d.status);
   puLog.innerHTML = `<b>وضعیت فایل قیمت:</b> ${d.status} · منبع: <code dir="ltr">${d.source||'—'}</code>`
     + (d.scanned?` · ${d.scanned} آیتم اسکن شد`:'');
 }).catch(()=>{$('#pu-state').textContent='فایل قیمت هنوز ساخته نشده'});
 $('#pu-save').onclick=()=>{DB.saveSettings({priceUrl:$('#pu-url').value.trim(),
   priceInterval:+en($('#pu-int').value)||60, priceMargin:+en($('#pu-mrg').value)||0,
   priceMatch:$('#pu-match').value, priceEnabled:$('#pu-on').checked});
   toast('تنظیمات قیمت ذخیره شد ✓ — برای اعمال، price_worker.py را اجرا کنید')};
 $('#pu-now').onclick=async()=>{const r=await DB.syncPrices();
   toast(r.status==='ok'?`${r.count} قیمت به‌روز شد ✓`:'همگام‌سازی انجام نشد: '+(r.message||r.status));
   if(r.status==='ok'&&r.count)render()};
}
